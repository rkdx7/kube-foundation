name: release-artifact

on:
  push:
    tags: ["v*"]

env:
  REGISTRY_HOST: ghcr.io
  REGISTRY_INSECURE: "false"
  FLEET_VERSION: latest

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flux
        uses: controlplaneio-fluxcd/distribution/actions/setup@main

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned artifacts
        run: |
          set -euo pipefail
          export REGISTRY_HOST="${REGISTRY_HOST}"
          export REGISTRY_INSECURE="${REGISTRY_INSECURE}"
          export REPOSITORY="${{ github.repository }}"
          export FLEET_VERSION="${FLEET_VERSION}"
          src="${{ github.server_url }}/${{ github.repository }}"
          rev="${{ github.sha }}"

          render() {
            local dir="$1" out="$2"
            rm -rf "$out"; mkdir -p "$out"
            cp -R "$dir/." "$out/"
            while IFS= read -r -d '' f; do
              if file -b --mime-encoding "$f" | grep -qE 'binary'; then continue; fi
              envsubst '${REGISTRY_HOST} ${REGISTRY_INSECURE} ${REPOSITORY} ${FLEET_VERSION}' < "$f" > "$f.tmp"
              mv "$f.tmp" "$f"
            done < <(find "$out" -type f -print0)
          }

          push() {
            local url="$1" path="$2" ver="$3"
            flux push artifact "${url}:${ver}" --path="$path" --source="$src" --revision="$rev"
            if [ "${ver}" != "latest" ]; then
              flux push artifact "${url}:latest" --path="$path" --source="$src" --revision="$rev"
            fi
          }

          rs_tag() {
            local file="$1" component="$2" v
            v="$(awk -v c="${component}" '
              /^    - component:/ { comp=$0; sub(/.*component: "/,"",comp); sub(/".*/,"",comp) }
              comp == c && /^      tag:/ { t=$0; sub(/.*tag: "/,"",t); sub(/".*/,"",t); print t; exit }
            ' "${file}")"
            echo "${v:-latest}"
          }

          render fleet .rendered/fleet
          push "oci://ghcr.io/${{ github.repository }}/fleet" .rendered/fleet "${FLEET_VERSION}"

          for c in infrastructure/components/*/; do
            n="$(basename "$c")"
            render "$c" ".rendered/$n"
            push "oci://ghcr.io/${{ github.repository }}/infrastructure/$n" ".rendered/$n" "$(rs_tag fleet/tenants/infra.yaml "$n")"
          done

          for c in apps/components/*/; do
            n="$(basename "$c")"
            render "$c" ".rendered/$n"
            push "oci://ghcr.io/${{ github.repository }}/apps/$n" ".rendered/$n" "$(rs_tag fleet/tenants/apps.yaml "$n")"
          done

      - name: Sign versioned artifacts
        run: |
          set -euo pipefail
          rs_tag() {
            local file="$1" component="$2" v
            v="$(awk -v c="${component}" '
              /^    - component:/ { comp=$0; sub(/.*component: "/,"",comp); sub(/".*/,"",comp) }
              comp == c && /^      tag:/ { t=$0; sub(/.*tag: "/,"",t); sub(/".*/,"",t); print t; exit }
            ' "${file}")"
            echo "${v:-latest}"
          }
          for tag in "${FLEET_VERSION}" latest; do
            cosign sign --yes "ghcr.io/${{ github.repository }}/fleet:${tag}"
          done
          for c in infrastructure/components/*/; do
            n="$(basename "$c")"
            for t in "$(rs_tag fleet/tenants/infra.yaml "$n")" latest; do
              cosign sign --yes "ghcr.io/${{ github.repository }}/infrastructure/$n:${t}"
            done
          done
          for c in apps/components/*/; do
            n="$(basename "$c")"
            for t in "$(rs_tag fleet/tenants/apps.yaml "$n")" latest; do
              cosign sign --yes "ghcr.io/${{ github.repository }}/apps/$n:${t}"
            done
          done
