apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: infra
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  inputs:
    - component: "cilium"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-core"
    - component: "kgateway"
      configs: "true"
      tag: "1.0.0"
      shard: "shard-core"
    - component: "cert-manager"
      configs: "true"
      tag: "1.0.0"
      shard: "shard-core"
    - component: "external-dns"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-core"
    - component: "external-secrets"
      configs: "true"
      tag: "1.0.0"
      shard: "shard-security"
    - component: "openbao"
      configs: "true"
      host: "openbao.${CLUSTER_DOMAIN}"
      tag: "1.0.0"
      shard: "shard-security"
    - component: "kyverno"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-security"
    - component: "falco"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-security"
    - component: "trivy"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-security"
    - component: "istio"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-platform"
    - component: "keda"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-platform"
    - component: "stakater"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-platform"
    - component: "velero"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-platform"
    - component: "rook"
      configs: "true"
      tag: "1.0.0"
      shard: "shard-platform"
    - component: "monitoring"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-observability"
    - component: "loki"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-observability"
    - component: "tempo"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-observability"
    - component: "opentelemetry"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-observability"
    - component: "vector"
      configs: "false"
      tag: "1.0.0"
      shard: "shard-observability"
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.component >>
        labels:
          toolkit.fluxcd.io/role: "infra"
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.component >>
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: flux-infra-<< inputs.component >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.component >>
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        # Named `-flux-config` (not `-config`) so it does not collide with
        # ConfigMaps that a component's Helm chart creates under the same
        # `<component>-config` name (e.g. OpenBao's `server.extraConfig`
        # ConfigMap, whose `extraconfig-from-values.hcl` key is not a valid
        # envsubst variable name and breaks postBuild substitution).
        name: << inputs.component >>-flux-config
        namespace: << inputs.component >>
        annotations:
          fluxcd.controlplane.io/reconcile: << if eq inputs.configs "true" >>enabled<< else >>disabled<< end >>
      data:
        # `host` is only set for a subset of inputs; use the Sprig `get`
        # helper, which yields "" for absent keys, because the ResourceSet
        # template engine runs with `missingkey=error` (so `inputs.host`
        # would fail for every component that does not define it).
        HOST: '<< get (inputs) "host" >>'
        CLUSTER_DOMAIN: "${CLUSTER_DOMAIN}"
        ISSUER: "${ISSUER}"
        ACME_EMAIL: "${ACME_EMAIL}"
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: infra
        namespace: << inputs.component >>
        labels:
          sharding.fluxcd.io/key: "<< inputs.shard >>"
      spec:
        interval: 5m
        serviceAccountName: flux
        url: "oci://${REGISTRY_HOST}/${REPOSITORY}/infrastructure/<< inputs.component >>"
        ref:
          tag: << inputs.tag >>
        insecure: ${REGISTRY_INSECURE}
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-controllers
        namespace: << inputs.component >>
        labels:
          sharding.fluxcd.io/key: "<< inputs.shard >>"
      spec:
        targetNamespace: << inputs.component >>
        serviceAccountName: flux
        commonMetadata:
          labels:
            sharding.fluxcd.io/key: "<< inputs.shard >>"
        # The shard label is applied by `commonMetadata` to the HelmRepository and
        # HelmRelease, but not to the HelmChart that helm-controller auto-generates
        # for a `chart.spec.sourceRef`. Without it the unsharded source-controller
        # reconciles the HelmChart and cannot find the shard-labelled HelmRepository
        # (the sharded source-controller ignores the unlabelled HelmChart). Pin the
        # same shard key onto every generated HelmChart via its template metadata.
        patches:
          - target:
              kind: HelmRelease
            patch: |-
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: not-used
              spec:
                chart:
                  metadata:
                    labels:
                      sharding.fluxcd.io/key: "<< inputs.shard >>"
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: infra
        path: "./controllers/${ENVIRONMENT}"
        prune: true
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: infra-configs
        namespace: << inputs.component >>
        labels:
          sharding.fluxcd.io/key: "<< inputs.shard >>"
        annotations:
          fluxcd.controlplane.io/reconcile: << if eq inputs.configs "true" >>enabled<< else >>disabled<< end >>
      spec:
        dependsOn:
          - name: infra-controllers
        targetNamespace: << inputs.component >>
        serviceAccountName: flux
        commonMetadata:
          labels:
            sharding.fluxcd.io/key: "<< inputs.shard >>"
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: infra
        path: "./configs/${ENVIRONMENT}"
        prune: true
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: << inputs.component >>-flux-config
