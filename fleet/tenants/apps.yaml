apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  inputs:
    - component: "frontend"
      tag: "1.0.0"
      shard: "shard-platform"
      host: "frontend.${CLUSTER_DOMAIN}"
    - component: "backend"
      tag: "1.0.0"
      shard: "shard-platform"
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.component >>
        labels:
          toolkit.fluxcd.io/role: "tenant"
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.component >>
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux
        namespace: << inputs.component >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.component >>
    # The built-in `admin` ClusterRole does not cover the Gateway API group,
    # so tenant apps that publish an HTTPRoute need an explicit grant.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: gateway-api
        namespace: << inputs.component >>
      rules:
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["httproutes", "grpcroutes", "tcproutes", "tlsroutes", "udproutes"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux-gateway-api
        namespace: << inputs.component >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: gateway-api
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.component >>
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: << inputs.component >>-flux-config
        namespace: << inputs.component >>
      data:
        # `host` is only set for a subset of inputs; see the note in infra.yaml.
        HOST: '<< get (inputs) "host" >>'
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: apps
        namespace: << inputs.component >>
        labels:
          sharding.fluxcd.io/key: "<< inputs.shard >>"
      spec:
        interval: 5m
        serviceAccountName: flux
        url: "oci://${REGISTRY_HOST}/${REPOSITORY}/apps/<< inputs.component >>"
        ref:
          tag: << inputs.tag >>
        insecure: ${REGISTRY_INSECURE}
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: apps
        namespace: << inputs.component >>
        labels:
          sharding.fluxcd.io/key: "<< inputs.shard >>"
      spec:
        targetNamespace: << inputs.component >>
        serviceAccountName: flux
        commonMetadata:
          labels:
            sharding.fluxcd.io/key: "<< inputs.shard >>"
        interval: 30m
        retryInterval: 5m
        wait: true
        timeout: 5m
        sourceRef:
          kind: OCIRepository
          name: apps
        path: "./${ENVIRONMENT}"
        prune: true
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: << inputs.component >>-flux-config
