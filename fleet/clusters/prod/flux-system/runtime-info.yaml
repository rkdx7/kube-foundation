apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-runtime-info
  namespace: flux-system
  labels:
    toolkit.fluxcd.io/runtime: "true"
    reconcile.fluxcd.io/watch: Enabled
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: "Merge"
data:
  ENVIRONMENT: prod
  CLUSTER_NAME: prod
  CLUSTER_DOMAIN: prod.example.com
  PROVIDER: aws
  # Not used on AWS (the cloud provides LoadBalancers); kube-vip is the on-prem
  # provider. Kept empty so kube-vip-cloud-provider allocates nothing.
  LOADBALANCER_CIDR: ""
  # Production uses a real Let's Encrypt issuer. Replace the ACME_EMAIL
  # placeholder with a real address (Let's Encrypt rejects example.com).
  ISSUER: letsencrypt-prod
  ACME_EMAIL: letsencrypt@example.com
  REGISTRY_HOST: "${REGISTRY_HOST}"
  REGISTRY_INSECURE: "${REGISTRY_INSECURE}"
  REPOSITORY: "${REPOSITORY}"
