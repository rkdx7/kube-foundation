apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-runtime-info
  namespace: flux-system
  labels:
    toolkit.fluxcd.io/runtime: "true"
    reconcile.fluxcd.io/watch: Enabled
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: "Merge"
data:
  ENVIRONMENT: staging
  CLUSTER_NAME: staging
  CLUSTER_DOMAIN: staging.example.com
  PROVIDER: onprem
  # Local/offline environments cannot complete a Let's Encrypt ACME challenge
  # (no public DNS), so staging uses a self-signed issuer.
  ISSUER: self-signed
  ACME_EMAIL: ""
  REGISTRY_HOST: "${REGISTRY_HOST}"
  REGISTRY_INSECURE: "${REGISTRY_INSECURE}"
  REPOSITORY: "${REPOSITORY}"
