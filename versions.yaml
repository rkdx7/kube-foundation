# kube-foundation — OCI artifact version + component correspondence table.
#
# The OCI artifact version (`oci`) is monorepo-wide and DECOUPLED from the
# component (Helm chart) versions. Bump `oci` to ship a new set of artifacts;
# the `components` table records which component version each OCI release
# contains (correspondence table: OCI version -> component version).
#
# The chart versions below must stay in sync with the `version:` field in each
# component's `controllers/base/*.yaml` HelmRelease.

oci: "1.0.0"

components:
  cilium: "1.20.2"
  ingress-nginx: "4.15.1"
  cert-manager: "v1.21.2"
  external-dns: "1.23.0"
  external-secrets: "2.12.0"
  openbao: "0.30.3"
  kyverno: "3.9.1"
  falco: "9.2.0"
  trivy: "0.37.0"
  istio: "1.30.5"
  keda: "2.21.0"
  velero: "12.2.1"
  longhorn: "1.9.1"
  # monitoring: kube-prometheus-stack (primary); metrics-server is pinned
  # separately in its own HelmRelease (3.14.0).
  monitoring: "92.2.0"
  loki: "7.3.0"
  tempo: "1.24.4"
  opentelemetry: "0.175.1"
  vector: "0.59.0"
