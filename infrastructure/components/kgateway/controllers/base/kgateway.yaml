apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway-crds
  namespace: kgateway
spec:
  interval: 30m
  releaseName: kgateway-crds
  targetNamespace: kgateway-system
  install:
    createNamespace: true
  chart:
    kind: OCIRepository
    spec:
      url: oci://cr.kgateway.dev/kgateway-dev/charts/kgateway-crds
      ref:
        tag: v2.4.3
      interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
  namespace: kgateway
spec:
  interval: 30m
  releaseName: kgateway
  targetNamespace: kgateway-system
  dependsOn:
    - name: kgateway-crds
  install:
    createNamespace: true
  chart:
    kind: OCIRepository
    spec:
      url: oci://cr.kgateway.dev/kgateway-dev/charts/kgateway
      ref:
        tag: v2.4.3
      interval: 24h
