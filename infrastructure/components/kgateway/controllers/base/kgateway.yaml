apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kgateway
  namespace: kgateway
spec:
  interval: 24h
  type: oci
  url: oci://cr.kgateway.dev/kgateway-dev/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway-crds
  namespace: kgateway
spec:
  interval: 30m
  releaseName: kgateway-crds
  targetNamespace: kgateway-system
  install:
    createNamespace: true
  chart:
    spec:
      chart: kgateway-crds
      sourceRef:
        kind: HelmRepository
        name: kgateway
      version: "v2.4.3"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
  namespace: kgateway
spec:
  interval: 30m
  releaseName: kgateway
  targetNamespace: kgateway-system
  dependsOn:
    - name: kgateway-crds
  install:
    createNamespace: true
  chart:
    spec:
      chart: kgateway
      sourceRef:
        kind: HelmRepository
        name: kgateway
      version: "v2.4.3"
