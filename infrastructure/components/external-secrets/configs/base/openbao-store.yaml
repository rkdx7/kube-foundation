apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    openBao:
      # In-cluster active-node service of the OpenBao HA cluster (plain HTTP,
      # TLS is terminated at the ingress edge).
      server: "http://openbao-active.openbao.svc:8200"
      # KV v2 mount path (see: `bao secrets enable -path=apps kv-v2`).
      path: "apps"
      version: "v2"
      auth:
        kubernetes:
          # Kubernetes auth mount path (`bao auth enable kubernetes`).
          path: "kubernetes"
          # OpenBao role bound to the external-secrets ServiceAccount.
          role: "eso"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app
  namespace: frontend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: demo-app-secret
  data:
    - secretKey: password
      remoteRef:
        key: demo/app
        property: password
