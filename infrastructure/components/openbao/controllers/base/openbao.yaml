apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 24h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  releaseName: openbao
  chart:
    spec:
      chart: openbao
      version: "0.30.3"
      sourceRef:
        kind: HelmRepository
        name: openbao
  values:
    server:
      standalone:
        enabled: false
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
      dataStorage:
        enabled: true
        size: 10Gi
        # Pin a storage class so all three HA replicas use the same backend.
        # Without this, the PVCs pick whatever the cluster default is at the
        # time each replica is created (e.g. `standard` then `longhorn` once
        # Longhorn becomes default), which leaves the cluster split across two
        # storage backends and can fault follower volumes.
        storageClass: standard
    ui:
      enabled: true
    injector:
      enabled: true
