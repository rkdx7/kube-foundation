apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: keda
  namespace: keda
spec:
  interval: 24h
  url: https://kedacore.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 30m
  releaseName: keda
  chart:
    spec:
      chart: keda
      version: "2.21.0"
      sourceRef:
        kind: HelmRepository
        name: keda
  values:
    installCRDs: true
