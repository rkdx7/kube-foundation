apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: trivy
  namespace: trivy
spec:
  interval: 24h
  url: https://aquasecurity.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy
spec:
  interval: 30m
  releaseName: trivy-operator
  chart:
    spec:
      chart: trivy-operator
      version: "0.37.0"
      sourceRef:
        kind: HelmRepository
        name: trivy
  values:
    installCRDs: true
    trivy:
      ignoreUnfixed: true
    nodeCollector:
      # The node-collector scan job targets each node via nodeSelector but its
      # tolerations are ignored (trivy-operator bug #2761), so it stays Pending
      # on the tainted kind control-plane. Exclude the control-plane from node
      # collection instead; it only gathers config/compliance data for the node.
      excludeNodes: "node-role.kubernetes.io/control-plane="
