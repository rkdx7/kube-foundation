apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: falco
  namespace: falco
spec:
  interval: 24h
  url: https://falcosecurity.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 30m
  releaseName: falco
  chart:
    spec:
      chart: falco
      version: "9.2.0"
      sourceRef:
        kind: HelmRepository
        name: falco
  values:
    tty: true
    falcosidekick:
      enabled: false
