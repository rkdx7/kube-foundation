apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: stakater
spec:
  interval: 24h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: stakater
spec:
  interval: 30m
  releaseName: reloader
  chart:
    spec:
      chart: reloader
      version: "2.2.18"
      sourceRef:
        kind: HelmRepository
        name: stakater
  values:
    reloader:
      # Watch ConfigMaps/Secrets across all namespaces and trigger rolling
      # upgrades on every Deployment/StatefulSet/DaemonSet that references them.
      watchGlobally: true
