apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rook-ceph
  namespace: rook
spec:
  interval: 24h
  url: https://charts.rook.io/release
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook
spec:
  interval: 30m
  releaseName: rook-ceph
  targetNamespace: rook-ceph
  install:
    createNamespace: true
  chart:
    spec:
      chart: rook-ceph
      version: "1.21.0"
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
  values:
    crds:
      enabled: true
    csi:
      # Rook 1.21 deploys the CSI drivers (RBD, CephFS) via the bundled
      # ceph-csi-operator subchart (default: true).
      installCsiOperator: true
    # Scan nodes for raw block devices, required for `storage.useAllDevices: true`
    # auto-discovery in the CephCluster CR.
    enableDiscoveryDaemon: true
