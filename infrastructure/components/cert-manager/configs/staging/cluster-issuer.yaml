apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: self-signed
spec:
  # Local/offline environments (no public DNS) cannot complete a Let's Encrypt
  # ACME challenge, so staging uses a self-signed issuer instead. Production
  # keeps the real ACME issuer defined in configs/prod/cluster-issuer.yaml.
  selfSigned: {}
