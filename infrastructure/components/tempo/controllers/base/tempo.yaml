apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tempo
  namespace: tempo
spec:
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: tempo
spec:
  interval: 30m
  releaseName: tempo
  chart:
    spec:
      chart: tempo
      sourceRef:
        kind: HelmRepository
        name: tempo
  values:
    tempo:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
